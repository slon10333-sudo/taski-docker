name: Main Taski Workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install dipendencies
        run: |
          python3 -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0 flake8-isort==7.0.0
      - name: Test with flacke8
        run: python3 -m flake8 backend/
  